<!doctype html><html lang="de"><head><meta charset="utf-8"><title>UI-003 · schmale Ansichten prüfen</title><style>body{margin:20px;background:#ccc;font:14px system-ui}nav{margin-bottom:20px}a{margin-right:20px}section{display:flex;gap:30px;align-items:start}iframe{border:2px solid #222;flex-shrink:0;box-sizing:content-box;height:740px}#w320{width:320px}#w390{width:390px}#w800{width:800px}body:has(:target) iframe:not(:target){display:none}output{display:block;margin:12px 0;font:12px monospace;white-space:pre-line}</style></head><body><nav><a href="#w320">320 px</a><a href="#w390">390 px</a><a href="#w800">800 px</a><a href="layout-check.html">Alle</a><button id="measure">Maße prüfen</button><output id="report"></output></nav><section><iframe id="w320" title="Tafel mit 320 Pixeln" src="/"></iframe><iframe id="w390" title="Tafel mit 390 Pixeln" src="/"></iframe><iframe id="w800" title="Tafel mit 800 Pixeln" src="/"></iframe></section><script>
document.querySelector('#measure').addEventListener('click',()=>{document.querySelector('#report').textContent=Array.from(document.querySelectorAll('iframe')).filter(frame=>getComputedStyle(frame).display!=='none').map(frame=>{const doc=frame.contentDocument,root=doc.documentElement,map=doc.querySelector('.board-art img'),box=map.getBoundingClientRect();return frame.id+': Breite '+root.clientWidth+', Inhalt '+root.scrollWidth+', Porträt '+getComputedStyle(doc.querySelector('.player-portrait')).fontSize+', Kartenverhältnis '+(box.width/box.height).toFixed(4)+' (Original '+(map.naturalWidth/map.naturalHeight).toFixed(4)+')';}).join('\n');});
</script></body></html>
