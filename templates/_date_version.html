{% macro date_version(today_display, css_class='arena-nav-date') -%}
<span class="{{ css_class }} date-version" aria-label="Datum {{ today_display }}, Version {{ config.PUBLIC_RELEASE }}">
  <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg>
  <span class="date-version-copy"><time>{{ today_display }}</time><small class="release-version" data-release-version>V {{ config.PUBLIC_RELEASE }}</small></span>
</span>
{%- endmacro %}
