<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mäxchen 21</title>
  <desc id="desc">Limettengrünes Mäxchen-Logo mit einer stilisierten 21 auf dunkelblauem Grund.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#254a96"/>
      <stop offset="0.58" stop-color="#101f4e"/>
      <stop offset="1" stop-color="#07142f"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecff75"/>
      <stop offset="1" stop-color="#bce92b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="13" stdDeviation="9" flood-color="#000817" flood-opacity=".72"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#bg)" stroke="#bce92b" stroke-width="24"/>
  <path d="M72 134c72-53 296-64 368 2" fill="none" stroke="#54d8ff" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  <g filter="url(#shadow)">
    <text x="256" y="252" fill="url(#lime)" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="174" font-weight="800" text-anchor="middle" letter-spacing="-18">21</text>
    <text x="256" y="352" fill="#ffffff" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="78" font-weight="800" text-anchor="middle" letter-spacing="-4">MÄXCHEN</text>
  </g>
  <circle cx="102" cy="405" r="13" fill="#54d8ff"/>
  <circle cx="410" cy="405" r="13" fill="#54d8ff"/>
</svg>
