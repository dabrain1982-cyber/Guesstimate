<!doctype html>
<html lang="de">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Black Jack · Kartenmuster</title>
 <style>
 *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 38%,#364232,#17241d 64%,#101813);color:#eee1c6;font-family:Georgia,serif}main{max-width:1100px;margin:auto;padding:24px 34px 20px}header{text-align:center;margin-bottom:22px}.eyebrow{font:11px/1.5 'Segoe UI',sans-serif;letter-spacing:.22em;color:#c2a573}h1{margin:5px 0 9px;font-size:30px;font-weight:400}header p{margin:0;font:14px/1.5 'Segoe UI',sans-serif;color:#c1b99f}.samples{display:flex;justify-content:center;gap:62px}.sample{margin:0;text-align:center}.front{display:block;width:238px;max-width:100%;height:auto;border-radius:12px;box-shadow:0 10px 20px #0007,0 2px 3px #0009}.sample:nth-child(1) .front{transform:rotate(-2deg)}.sample:nth-child(3) .front{transform:rotate(2deg)}figcaption{font:12px/1.5 'Segoe UI',sans-serif;color:#d2c5a9;margin-top:13px}.table-scale{margin:19px auto 0;text-align:center}.table-scale p{font:11px/1.5 'Segoe UI',sans-serif;color:#b8b49e;margin:0 0 3px}.small-cards{display:flex;justify-content:center;gap:15px;perspective:900px;height:106px}.small-cards img{width:88px;height:auto;align-self:center;transform:rotateX(35deg);filter:drop-shadow(1px 4px 3px #0008);border-radius:5px}footer{margin-top:10px;text-align:center;font:12px/1.5 'Segoe UI',sans-serif;color:#bcb194}@media(max-width:850px){main{padding:20px}.samples{gap:22px}.front{width:min(26vw,238px)}h1{font-size:25px}}@media(max-width:500px){.samples{gap:12px}.front{width:28vw}.sample figcaption{font-size:10px}header p{font-size:12px}.small-cards img{width:70px}.small-cards{height:94px}}
 </style>
</head>
<body><main>
 <header><span class="eyebrow">BLACK JACK · ENTWURF</span><h1>Neue Kartenvorderseiten</h1><p>Warmes Elfenbeinpapier, dunkle Druckfarben und ein gemaltes Königsbild.</p></header>
 <section class="samples" aria-label="Drei Kartenmuster">
  <figure class="sample"><img class="front" src="cards/blackjack/fronts-ivory-v1/AS.svg" alt="Pik-Ass auf warmem Elfenbeinpapier"><figcaption>Pik-Ass</figcaption></figure>
  <figure class="sample"><img class="front" src="cards/blackjack/fronts-ivory-v1/7D.svg" alt="Karo-Sieben mit sieben roten Karo-Symbolen"><figcaption>Karo-Sieben</figcaption></figure>
  <figure class="sample"><img class="front" src="cards/blackjack/fronts-ivory-v1/KC.svg" alt="Kreuz-König mit gemaltem Doppelbild"><figcaption>Kreuz-König</figcaption></figure>
 </section>
 <section class="table-scale" aria-label="Kleine Ansicht am Tisch"><p>Lesbarkeit in kleiner Tischansicht</p><div class="small-cards"><img src="cards/blackjack/fronts-ivory-v1/AS.svg" alt="Kleines Pik-Ass"><img src="cards/blackjack/fronts-ivory-v1/7D.svg" alt="Kleine Karo-Sieben"><img src="cards/blackjack/fronts-ivory-v1/KC.svg" alt="Kleiner Kreuz-König"></div></section>
 <footer>Freigegebener Kartensatz · Große Eckwerte für den Spieltisch.</footer>
</main><script type="module">import {frontUrl} from './blackjack-card-art.js';for(const img of document.querySelectorAll('.front,.small-cards img')){const code=img.getAttribute('src').split('/').at(-1).replace('.svg','');img.src=frontUrl(code);}</script></body></html>
